<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Traffic Counter</title>
  <link rel="stylesheet" href="traffic counter.css">
</head>
<body>

  <div class="counter-box">
    <h1>Traffic Counter</h1>
    <div id="count">0</div>

    <div class="buttons">
      <button onclick="increase()">+</button>
      <button onclick="decrease()">-</button>
      <button onclick="reset()">Reset</button>
    </div>
  </div>

  <script src="traffic counter.js"></script>
</body>
</html>
